<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>عائلة الأرصاد</title>
<meta name="description" content="خلف كل معلومة جوية فريق من المتخصصين.. اكتشف طريقك إلى عالم الأرصاد">
<meta name="theme-color" content="#232562">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: the Canva deck as a playable journey — indigo sky with isobars, white speech cards, مُزن as the guide on every screen */
:root{
  --sky:#232562;--sky-2:#1C1D52;--sky-3:#2E3080;
  --indigo:#4A4DC4;--indigo-2:#3B3EAE;--peri:#A6A9F0;--lav:#8E91D6;--lav-2:#C9CBF2;--lav-soft:#E9EAFB;
  --ink:#1E1F5C;--ink-2:#4B4D84;--white:#FFFFFF;
  --ok:#22A06B;--ok-soft:#DFF5EA;--bad:#D9534F;--bad-soft:#FBE3E2;--gold:#F5B942;
  --f:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:22px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--sky)}
body{font-family:var(--f);color:var(--white);line-height:1.7;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:700;line-height:1.25;text-wrap:balance}

/* ---------- sky backdrop ---------- */
.sky{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(1200px 700px at 80% 0%,#2D2F7A 0%,transparent 60%),radial-gradient(900px 600px at 0% 100%,#3A2F7E 0%,transparent 60%),var(--sky)}
.sky .spiral{position:absolute;width:min(34vw,420px);opacity:.55}
.sky .spiral.l{top:-4vw;left:-6vw;animation:turn 90s linear infinite}
.sky .spiral.h{bottom:6vh;right:-8vw;transform:scaleX(-1);animation:turn 120s linear infinite reverse}
.sky .letter{position:absolute;font-size:clamp(48px,6vw,84px);font-weight:700;color:rgba(201,203,242,.55)}
.sky .letter.l{top:clamp(70px,9vw,120px);left:clamp(40px,5.5vw,80px)}
.sky .letter.h{bottom:clamp(140px,22vh,220px);right:clamp(28px,5vw,80px)}
.sky .bottom{position:absolute;left:-2%;right:-2%;bottom:-2px;width:104%;max-width:none;opacity:.95;animation:sway 14s ease-in-out infinite alternate}
.sky .sun{position:absolute;top:clamp(70px,10vh,120px);right:clamp(12px,4vw,70px);width:clamp(90px,11vw,170px);animation:float 7s ease-in-out infinite}
.sky .rain{position:absolute;top:38vh;left:clamp(10px,2vw,30px);width:clamp(60px,7vw,100px);animation:float 9s ease-in-out infinite reverse}
.sky svg.wind{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}
.sky svg.wind path{fill:none;stroke:rgba(201,203,242,.32);stroke-width:1.4;stroke-dasharray:6 9;animation:flow 22s linear infinite}
.sky svg.wind path:nth-child(2n){animation-duration:30s;animation-direction:reverse}
@keyframes turn{to{transform:rotate(360deg)}}
.sky .spiral.h{animation-name:turnflip}
@keyframes turnflip{from{transform:scaleX(-1) rotate(0)}to{transform:scaleX(-1) rotate(-360deg)}}
@keyframes sway{to{transform:translateX(-1.5%)}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes flow{to{stroke-dashoffset:-300}}

/* ---------- HUD ---------- */
.hud{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.hud>*{pointer-events:auto}
.hud .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:1rem;background:rgba(28,29,82,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(201,203,242,.25);border-radius:99px;padding:5px 14px 5px 6px}
.hud .brand img{width:34px;height:auto}
.hud .tools{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(28,29,82,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(201,203,242,.25);border-radius:99px;padding:6px 14px;font-weight:700;font-size:.92rem}
.chip .star{color:var(--gold)}
.chip.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.2)}}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;padding:0;background:rgba(28,29,82,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(201,203,242,.25);color:var(--white)}
.iconbtn svg{width:20px;height:20px}
.steps{display:flex;gap:6px;align-items:center}
.steps i{display:block;width:26px;height:6px;border-radius:99px;background:rgba(201,203,242,.3);transition:background .3s,width .3s}
.steps i.on{background:var(--peri);width:40px}
.steps i.done{background:var(--white)}

/* ---------- screens ---------- */
main{position:relative;z-index:1;min-height:100vh;min-height:100svh}
.screen{min-height:100vh;min-height:100svh;padding:calc(env(safe-area-inset-top,0px) + 76px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;justify-content:center;max-width:1400px;margin:0 auto;animation:enter .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* buttons from the deck */
.next{display:inline-flex;align-items:center;gap:18px;background:var(--indigo);color:var(--white);border:0;border-radius:99px;padding:8px 34px 8px 8px;font-size:clamp(1.2rem,2.2vw,1.6rem);font-weight:700;
  box-shadow:0 12px 30px -12px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.12);transition:transform .15s,box-shadow .15s}
.next .arrow{order:2;width:clamp(44px,4.5vw,58px);height:clamp(44px,4.5vw,58px);border-radius:50%;background:var(--white);color:var(--indigo);display:grid;place-items:center;transition:transform .2s}
.next .arrow svg{width:55%;height:55%}
.next:hover{transform:translateY(-2px)}
.next:hover .arrow{transform:translateX(4px)}
.next[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.next.light{background:var(--peri);color:var(--ink)}
.next.light .arrow{background:var(--white);color:var(--indigo)}
.ghostbtn{background:rgba(255,255,255,.1);border:1.5px solid rgba(201,203,242,.5);color:var(--white);border-radius:99px;padding:10px 22px;font-weight:700}
.ghostbtn:hover{background:rgba(255,255,255,.18)}

/* مُزن */
.muzn{position:relative;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35));animation:hover 4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes hover{50%{transform:translateY(-12px)}}
.muzn.cheer{animation:cheer .8s cubic-bezier(.3,1.6,.5,1) 1,hover 4s ease-in-out .8s infinite}
@keyframes cheer{30%{transform:translateY(-26px) rotate(-4deg)}60%{transform:translateY(0) rotate(3deg)}}
.muzn.oops{animation:oops .5s 1,hover 4s ease-in-out .5s infinite}
@keyframes oops{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.name{display:inline-flex;align-items:center;gap:6px;background:#7376E4;color:var(--white);border-radius:99px;padding:4px 16px;font-weight:700;font-size:1.05rem;box-shadow:0 6px 16px -6px rgba(0,0,0,.4)}
.name img{width:30px}
.bubble{position:relative;background:var(--white);color:var(--ink);border-radius:30px;padding:clamp(18px,2.4vw,30px) clamp(20px,2.8vw,40px);box-shadow:0 20px 50px -20px rgba(0,0,0,.55)}
.bubble .name{position:absolute;top:-20px;left:clamp(24px,8%,120px)}
.bubble .txt{font-size:clamp(1.02rem,1.55vw,1.32rem);font-weight:600;line-height:1.85}
.bubble .txt p+p{margin-top:.8em}
.bubble .txt strong{font-weight:700;color:var(--indigo-2)}
.bubble.tail-left::after{content:"";position:absolute;left:-26px;top:58%;border:18px solid transparent;border-right:34px solid var(--white);border-left:0}
.bubble.tail-right::after{content:"";position:absolute;right:-26px;top:50%;border:18px solid transparent;border-left:34px solid var(--white);border-right:0}
.bubble.tail-down::after{content:"";position:absolute;left:12%;bottom:-40px;border:0 solid transparent;border-top:44px solid var(--white);border-left:0;border-right:46px solid transparent}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--indigo);vertical-align:middle;margin-inline-start:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.skip{position:absolute;bottom:10px;left:16px;font-size:.78rem;color:var(--ink-2);background:none;border:0;padding:4px 6px}

/* ---------- 1 cover ---------- */
#cover{padding:0;max-width:none;position:relative;overflow:hidden;justify-content:center;align-items:center;text-align:center}
#cover .bg{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--sky) center/cover no-repeat;animation:kb 28s ease-in-out infinite alternate}
#cover .bg::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(ellipse at center,rgba(35,37,98,.35),rgba(35,37,98,.15) 45%,transparent 70%)}
@keyframes kb{to{transform:scale(1.08) translate(-1.5%,1%)}}
#cover .scan{position:absolute;right:13%;top:9%;width:min(26vw,360px);aspect-ratio:2/1;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(166,169,240,.25),transparent);mix-blend-mode:screen;animation:scan 3.4s ease-in-out infinite}
@keyframes scan{0%{transform:translateX(30%);opacity:0}30%,70%{opacity:1}100%{transform:translateX(-80%);opacity:0}}
#cover .inner{position:relative;z-index:2;padding:calc(env(safe-area-inset-top,0px) + 30px) 18px calc(env(safe-area-inset-bottom,0px) + 30px)}
#cover h1{font-size:clamp(3.4rem,10.5vw,9rem);line-height:1.05;letter-spacing:-.01em;text-shadow:0 8px 40px rgba(20,20,70,.6);animation:enter .9s .1s both}
#cover h1 span{display:inline-block;animation:letter 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes letter{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:none}}
#cover .sub{margin-top:clamp(18px,3vw,34px);font-size:clamp(1.05rem,1.8vw,1.4rem);font-weight:600;line-height:1.8;text-shadow:0 2px 14px rgba(20,20,70,.7);animation:enter .9s .45s both}
#cover .next{margin-top:clamp(26px,4vw,46px);animation:enter .9s .7s both,glow 2.6s ease-in-out 1.6s infinite}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(166,169,240,.18),0 12px 30px -12px rgba(0,0,0,.6)}}
#cover .resume{display:block;margin:16px auto 0;font-size:.95rem;color:var(--lav-2);background:none;border:0;text-decoration:underline;text-underline-offset:4px}

/* ---------- 2 intro ---------- */
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:clamp(20px,4vw,60px);align-items:center}
.intro .muzn{order:2;width:min(100%,460px);justify-self:center}
.intro .right{order:1;display:flex;flex-direction:column;gap:clamp(22px,3vw,40px);align-items:flex-start}
.intro .bubble{width:100%}
.intro .actions{align-self:flex-end}

/* ---------- 3 jobs ---------- */
.jobs-head{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:clamp(18px,2.5vw,30px)}
.jobs-head .bubble{border-radius:99px;padding:14px clamp(22px,3vw,44px);text-align:center;max-width:820px}
.jobs-head .bubble .txt{font-size:clamp(.96rem,1.35vw,1.15rem)}
.jobs-head .bubble .name{top:-18px;left:auto;right:clamp(30px,10%,140px)}
.jobs-head .muzn{width:clamp(80px,9vw,128px);flex:0 0 auto}
.jobgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(12px,1.6vw,22px)}
.job{grid-column:span 3;position:relative;background:var(--white);color:var(--ink);border-radius:var(--r);padding:12px 12px 14px;text-align:center;display:flex;flex-direction:column;gap:6px;
  box-shadow:0 16px 40px -20px rgba(0,0,0,.6);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.job:nth-child(5){grid-column:3 / span 3}
.job:hover{transform:translateY(-6px) rotate(-.4deg);box-shadow:0 26px 50px -20px rgba(0,0,0,.7)}
.job .ph{border-radius:16px;overflow:hidden;aspect-ratio:300/177;background:var(--lav-soft)}
.job .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.job:hover .ph img{transform:scale(1.06)}
.job h3{font-size:clamp(1.08rem,1.55vw,1.38rem);color:var(--ink);margin-top:4px}
.job p{font-size:clamp(.82rem,1.05vw,.94rem);font-weight:600;color:var(--ink-2);line-height:1.65;flex:1}
.job .go{margin-top:6px;align-self:center;width:min(100%,250px);background:var(--indigo);color:var(--white);border:0;border-radius:99px;padding:7px 12px;font-weight:700;font-size:clamp(.95rem,1.25vw,1.12rem);transition:background .2s}
.job .go:hover{background:var(--indigo-2)}
.job .tag{position:absolute;top:18px;left:18px;font-size:.74rem;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--gold);color:var(--ink);box-shadow:0 4px 10px -4px rgba(0,0,0,.4)}
.job .tag.done{background:var(--ok);color:var(--white)}
.job .tag.soon{background:rgba(30,31,92,.75);color:var(--white)}

/* ---------- 4 story ---------- */
.pill-title{display:inline-flex;align-items:center;gap:14px;align-self:center;background:rgba(255,255,255,.08);border:2px solid rgba(201,203,242,.55);border-radius:99px;padding:6px 26px 6px 8px;font-size:clamp(1.25rem,2.4vw,1.9rem);font-weight:700;margin-bottom:clamp(14px,2vw,26px)}
.pill-title .ic{width:clamp(46px,5vw,62px);height:clamp(46px,5vw,62px);border-radius:50%;border:2px solid rgba(201,203,242,.55);display:grid;place-items:center;order:2}
.pill-title .ic img{width:60%}
.story{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1.35fr);gap:clamp(12px,2vw,26px);align-items:center}
.story .muzn{width:min(100%,360px);order:3;justify-self:center}
.story .bubble{order:2;text-align:center}
.story .room{order:1;position:relative;border-radius:var(--r);overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.8)}
.story .room img{width:100%}
.story .room::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(180deg,transparent 0 47%,rgba(166,169,240,.22) 50%,transparent 53% 100%);background-size:100% 220%;animation:sweep 4.5s linear infinite;mix-blend-mode:screen}
@keyframes sweep{from{background-position:0 -120%}to{background-position:0 120%}}
.center-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:clamp(18px,3vw,34px)}

/* ---------- challenges ---------- */
.ch-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:clamp(10px,1.6vw,20px)}
.badge-title{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:2px solid rgba(201,203,242,.55);border-radius:99px;padding:6px 22px 6px 6px;font-size:clamp(1.1rem,2vw,1.6rem);font-weight:700}
.badge-title .ic{width:44px;height:44px;border-radius:50%;border:2px solid rgba(201,203,242,.55);display:grid;place-items:center;order:2}
.badge-title .ic img{width:62%}
.q-bubble{display:flex;align-items:center;gap:10px}
.q-bubble .bubble{border-radius:99px;padding:12px clamp(22px,3vw,40px)}
.q-bubble .bubble h2{font-size:clamp(1.25rem,2.6vw,2rem);color:var(--indigo-2)}
.q-bubble .muzn{width:clamp(70px,8vw,110px);flex:0 0 auto}
.lead{font-size:clamp(1rem,1.6vw,1.3rem);font-weight:600;text-align:center;max-width:46ch;margin:0 auto clamp(14px,2vw,26px)}
.ch1{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,2.1fr);gap:clamp(12px,2vw,30px);align-items:start}
.obs{order:3;display:flex;flex-direction:column;align-items:center;gap:12px}
.mapcard{position:relative;width:100%;border-radius:18px;overflow:hidden;background:#1d6e95;box-shadow:0 20px 50px -24px rgba(0,0,0,.8)}
.mapcard img{width:100%}
.zoom{position:absolute;top:10px;left:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--ink);display:grid;place-items:center;padding:0;box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
.zoom svg{width:18px;height:18px}
.legend{position:absolute;top:4%;right:3%;width:min(60%,440px);background:rgba(36,52,92,.88);border-radius:10px;padding:8px 10px 6px;color:#E8F0F8;direction:rtl}
.legend b{display:block;text-align:center;font-size:.72rem;font-weight:600;margin-bottom:4px}
.legend .row{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.legend .seg{display:flex;flex-direction:column;gap:2px;font-size:.56rem;line-height:1.25;text-align:center}
.legend .seg i{display:flex;height:9px;border-radius:2px;overflow:hidden}
.legend .seg i span{flex:1}
.capt{background:var(--white);color:var(--ink);border-radius:99px;padding:8px 30px;font-weight:700;font-size:clamp(.95rem,1.4vw,1.15rem)}
.model{order:1;display:flex;flex-direction:column;align-items:center;gap:12px;background:none;border:0;padding:0;color:inherit}
.model .mapcard{border:4px solid transparent;transition:border-color .2s,transform .2s;background:#d9e8f2}
.model:hover .mapcard{transform:translateY(-3px)}
.model .num{width:clamp(70px,7vw,100px);height:clamp(44px,4.4vw,60px);border-radius:99px;background:var(--white);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:clamp(1.3rem,2vw,1.7rem);transition:background .2s,color .2s}
.model.sel .mapcard{border-color:var(--peri);transform:translateY(-4px)}
.model.sel .num{background:var(--peri);color:var(--ink)}
.model.right .mapcard{border-color:var(--ok)}.model.right .num{background:var(--ok);color:var(--white)}
.model.wrong .mapcard{border-color:var(--bad)}.model.wrong .num{background:var(--bad);color:var(--white)}
.model .hint{font-size:.85rem;color:var(--lav-2)}

.feedback{max-width:780px;margin:clamp(14px,2vw,22px) auto 0;border-radius:18px;padding:14px 18px;font-weight:600;font-size:clamp(.98rem,1.4vw,1.12rem);display:flex;gap:12px;align-items:flex-start;color:var(--ink);animation:enter .4s both}
.feedback.ok{background:var(--ok-soft);border:2px solid var(--ok)}
.feedback.no{background:var(--bad-soft);border:2px solid var(--bad)}
.feedback .ico{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--white);font-weight:700}
.feedback.ok .ico{background:var(--ok)}.feedback.no .ico{background:var(--bad)}
.feedback b{display:block;font-size:1.05em}

/* ch2 */
.ch2-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(14px,2.5vw,40px);align-items:center;margin-bottom:clamp(12px,2vw,24px)}
.ch2-title{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.ch2-title .small{background:linear-gradient(180deg,#A49BEA,#7E77D8);border-radius:99px;padding:4px 30px;font-weight:700;font-size:clamp(1.1rem,1.8vw,1.5rem);margin-inline-start:clamp(30px,7vw,120px)}
.ch2-title .big{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#F4F5FF,#D9DBF8);color:var(--ink);border-radius:99px;padding:8px 30px 8px 10px;box-shadow:0 14px 36px -16px rgba(0,0,0,.6)}
.ch2-title .big h2{font-size:clamp(1.6rem,3.4vw,2.8rem);order:1}
.ch2-title .big .cy{order:2;width:clamp(54px,5.5vw,76px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#5f8cf0,#2a4bd0);display:grid;place-items:center;box-shadow:0 0 0 4px #fff,0 8px 20px -8px rgba(0,0,0,.6)}
.ch2-title .big .cy img{width:80%;animation:turn 3s linear infinite reverse}
.ch2-guide{display:flex;align-items:center;gap:8px}
.ch2-guide .muzn{width:clamp(110px,13vw,190px);flex:0 0 auto}
.ch2-guide .bubble{flex:1}
.ch2-guide .bubble .txt{font-size:clamp(.98rem,1.4vw,1.2rem)}
.ch2{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1fr) minmax(0,1fr);gap:clamp(12px,2vw,28px);align-items:start}
.track.t0{order:3}.track.t1{order:2}.ch2 .opts{order:1}
.track{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.track h3{font-size:clamp(1.15rem,1.9vw,1.6rem)}
.track .when{font-size:clamp(.82rem,1.1vw,.98rem);color:var(--lav-2);font-weight:500;line-height:1.5;direction:rtl}
.track .when bdi{direction:ltr;unicode-bidi:isolate}
.trackmap{position:relative;width:100%;aspect-ratio:416/304;border-radius:16px;overflow:hidden;margin-top:6px;box-shadow:0 20px 50px -24px rgba(0,0,0,.8)}
.trackmap>img{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover}
.trackmap svg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}
.trackmap .path{fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:9 8}
.trackmap .head{fill:#fff}
.trackmap .storm{position:absolute;width:15%;aspect-ratio:1;transform:translate(-50%,-50%);filter:drop-shadow(0 0 10px rgba(120,170,255,.8))}
.trackmap .storm img{width:100%;animation:turn 2.2s linear infinite reverse}
.replay{margin-top:4px;font-size:.88rem;padding:6px 14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opts h3{font-size:clamp(1.15rem,1.9vw,1.6rem);margin-bottom:4px}
.opt{display:flex;align-items:center;gap:12px;justify-content:space-between;text-align:start;background:var(--lav-soft);color:var(--ink);border:3px solid transparent;border-radius:18px;padding:10px 16px;font-weight:700;font-size:clamp(.94rem,1.3vw,1.1rem);line-height:1.55;transition:transform .15s,border-color .15s}
.opt:hover:not([disabled]){transform:translateX(-4px)}
.opt .rad{order:2;flex:0 0 30px;height:30px;border-radius:50%;border:2.5px solid var(--ink);display:grid;place-items:center;background:var(--white)}
.opt .rad::after{content:"";width:14px;height:14px;border-radius:50%;background:transparent;transition:background .15s}
.opt.sel{border-color:var(--peri)}
.opt.sel .rad::after{background:var(--indigo)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.right .rad{border-color:var(--ok)}.opt.right .rad::after{background:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong .rad{border-color:var(--bad)}.opt.wrong .rad::after{background:var(--bad)}
.opt[disabled]{cursor:default}

/* ---------- result ---------- */
.res-top{display:flex;align-items:flex-end;gap:10px;margin-bottom:clamp(14px,2vw,26px)}
.res-top .muzn{width:clamp(150px,19vw,280px);flex:0 0 auto}
.res-top .bubble{max-width:560px;margin-bottom:clamp(40px,7vw,110px)}
.res-top .bubble .txt{font-size:clamp(.98rem,1.4vw,1.15rem);text-align:center}
.flow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:clamp(6px,1vw,14px);align-items:stretch;direction:ltr}
.stage{direction:rtl;background:var(--white);color:var(--ink);border-radius:28px;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:clamp(250px,26vw,330px);box-shadow:0 20px 50px -24px rgba(0,0,0,.7);
  opacity:0;transform:translateY(24px) scale(.96);transition:opacity .5s,transform .5s cubic-bezier(.2,.8,.3,1.2)}
.stage.in{opacity:1;transform:none}
.stage .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--lav);color:var(--white);border-radius:16px;padding:10px 16px;font-weight:700;font-size:clamp(1rem,1.5vw,1.3rem);line-height:1.3}
.stage .hd img{width:clamp(26px,2.6vw,38px);order:2}
.stage .hd small{display:block;font-size:.72em;font-weight:500}
.stage .bd{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(10px,2vw,26px);flex-wrap:wrap;text-align:center}
.item{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:clamp(.95rem,1.35vw,1.15rem);color:var(--indigo-2);background:none;border:0;padding:6px}
.item img,.item svg{width:clamp(56px,6vw,84px);height:clamp(56px,6vw,84px);object-fit:contain;transition:transform .3s}
.item:hover img,.item:hover svg{transform:scale(1.1) rotate(-4deg)}
.item.en{direction:ltr;font-size:clamp(.92rem,1.3vw,1.1rem);line-height:1.25}
.item.en small{display:block;direction:rtl;font-size:.8em;color:var(--ink-2);font-weight:600;margin-top:2px}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.skill{display:flex;align-items:center;justify-content:space-between;gap:8px;border:2px solid #D4D6F4;background:linear-gradient(180deg,#fff,#F1F2FD);border-radius:16px;padding:10px 12px;font-weight:700;font-size:clamp(.84rem,1.15vw,1rem);line-height:1.3;color:var(--indigo-2);text-align:start}
.skill img{width:clamp(26px,2.6vw,36px);order:2}
.dest{font-size:clamp(1.5rem,2.6vw,2.2rem);font-weight:700;line-height:1.35;color:var(--indigo-2)}
.arr{align-self:center;color:var(--white);display:grid;place-items:center;opacity:0;transition:opacity .4s}
.arr.in{opacity:1;animation:nudge 1.4s ease-in-out infinite}
.arr svg{width:clamp(24px,2.4vw,34px)}
@keyframes nudge{50%{transform:translateX(5px)}}
.award{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:clamp(18px,2.5vw,30px)}
.medal{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);border:1.5px solid rgba(201,203,242,.45);border-radius:99px;padding:6px 20px 6px 6px;font-weight:700}
.medal .m{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE6A6,var(--gold) 60%,#C98A1C);display:grid;place-items:center;color:var(--ink);box-shadow:0 0 0 4px rgba(245,185,66,.25),0 0 24px rgba(245,185,66,.5);order:2}
.medal .m img{width:62%}
.medal small{display:block;font-weight:500;color:var(--lav-2);font-size:.82rem}

/* ---------- modal ---------- */
.modal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;background:rgba(14,15,50,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-left,0px))}
.modal .box{position:relative;background:var(--white);color:var(--ink);border-radius:28px;padding:26px;max-width:520px;width:100%;text-align:center;animation:pop .35s cubic-bezier(.2,.8,.3,1.2);max-height:calc(100svh - 32px);overflow:auto}
.modal .box .muzn{width:150px;margin:-90px auto 4px;animation:none}
.modal .box h3{font-size:1.4rem;margin-bottom:6px}
.modal .box p{color:var(--ink-2);font-weight:600}
.modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.modal .row .ghostbtn{color:var(--ink);border-color:#D4D6F4;background:var(--lav-soft)}
.modal.zoomer .box{max-width:min(1100px,96vw);padding:12px;background:#1d2a55}
.modal.zoomer img{width:100%;border-radius:16px}
.modal.zoomer .cap{color:var(--white);font-weight:700;margin-top:8px}
.close{position:absolute;top:10px;left:10px;width:40px;height:40px;border-radius:50%;border:0;background:var(--lav-soft);color:var(--ink);font-size:1.2rem;font-weight:700;padding:0;z-index:2}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
#fx{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;pointer-events:none;z-index:70}
.plus{position:fixed;z-index:80;pointer-events:none;background:var(--gold);color:var(--ink);font-weight:700;border-radius:99px;padding:4px 14px;box-shadow:0 8px 20px -6px rgba(0,0,0,.5);animation:plus 1.2s ease-out forwards}
@keyframes plus{from{opacity:1;transform:translate(-50%,0) scale(.8)}20%{transform:translate(-50%,-10px) scale(1.1)}to{opacity:0;transform:translate(-50%,-70px)}}

/* ---------- responsive: iPad ---------- */
@media (max-width:1100px){
  .job{grid-column:span 4}
  .job:nth-child(5){grid-column:span 4}
  .job:nth-child(7){grid-column:5 / span 4}
  .story{grid-template-columns:minmax(0,.7fr) minmax(0,1fr)}
  .story .room{grid-column:1 / -1;order:3;max-width:760px;justify-self:center}
  .story .muzn{order:1;max-width:280px}
  .ch1{grid-template-columns:1fr 1fr}
  .obs{grid-column:1 / -1;order:0}
  .ch2{grid-template-columns:1fr 1fr}
  .ch2 .opts{grid-column:1 / -1;order:3}
  .track.t0{order:1}.track.t1{order:2}
  .ch2-top{grid-template-columns:1fr}
  .ch2-title{align-items:center}
  .ch2-guide{flex-direction:column}
  .ch2-guide .bubble.tail-right::after{left:50%;right:auto;top:-30px;transform:translateX(-50%);border:16px solid transparent;border-bottom:30px solid var(--white);border-top:0}
  .flow{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);row-gap:16px}
  .flow .arr.mid{display:none}
}
/* ---------- responsive: phone ---------- */
@media (max-width:700px){
  .hud .brand span{display:none}
  .steps i{width:14px}.steps i.on{width:24px}
  .screen{padding-top:calc(env(safe-area-inset-top,0px) + 70px);justify-content:flex-start}
  #cover{justify-content:center}
  #cover .scan{display:none}
  .intro{grid-template-columns:1fr}
  .intro .muzn{order:0;width:200px}
  .intro .right{order:1;align-items:stretch}
  .intro .actions{align-self:center}
  .bubble.tail-left::after,.bubble.tail-right::after{left:50%;right:auto;top:-30px;transform:translateX(-50%);border:16px solid transparent;border-bottom:30px solid var(--white);border-top:0}
  .bubble .name{top:-18px}
  .jobs-head{flex-direction:column-reverse;gap:4px}
  .jobs-head .bubble{border-radius:24px}
  .jobgrid{grid-template-columns:1fr 1fr}
  .job,.job:nth-child(5),.job:nth-child(7){grid-column:auto}
  .job p{font-size:.8rem;line-height:1.55}
  .job:nth-child(7){grid-column:1 / -1;width:calc(50% - 6px);justify-self:center}
  .job .go{font-size:.92rem;padding:6px 8px}
  .story{grid-template-columns:1fr}
  .story .muzn{max-width:190px;order:1}
  .story .bubble{order:2}
  .story .room{order:3}
  .q-bubble{flex-direction:row-reverse}
  .ch-head{justify-content:center}
  .ch1{grid-template-columns:1fr 1fr;gap:12px}
  .legend{position:static;width:100%;border-radius:0}
  .ch2{grid-template-columns:1fr}
  .ch2 .opts{order:3}
  .ch2-guide{flex-direction:column}
  .ch2-guide .muzn{width:130px}
  .ch2-title .small{margin:0}
  .res-top{flex-direction:column;align-items:center}
  .res-top .bubble{margin-bottom:0}
  .res-top .muzn{width:170px;order:-1}
  .flow{grid-template-columns:1fr;direction:rtl}
  .flow .arr,.flow .arr.mid{display:grid}
  .flow .arr svg{transform:rotate(90deg)}
  .arr.in{animation:nudgeY 1.4s ease-in-out infinite}
  @keyframes nudgeY{50%{transform:translateY(5px)}}
  .stage{min-height:0}
  .sky .spiral{width:60vw;opacity:.35}
  .sky .sun{width:80px;top:auto;bottom:26vh}
  .sky .letter.h{display:none}
}
@media (max-width:380px){.jobgrid{grid-template-columns:1fr}.ch1{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

let AC=null;
function tone(seq){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
  seq.forEach(([f,d,ty])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d*.8})}catch(e){}}
const SFX={tap:()=>tone([[540,.06,'triangle']]),ok:()=>tone([[660,.12],[880,.12],[1175,.22]]),no:()=>tone([[240,.16,'square'],[190,.22,'square']]),win:()=>tone([[523,.14],[659,.14],[784,.14],[1047,.4]]),type:()=>tone([[900+Math.random()*200,.02,'triangle']])};
function drawSnd(){$('#snd').setAttribute('aria-pressed',S.sound);$('#snd').innerHTML=S.sound?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'}

/* ================= helpers ================= */
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let typing=null;
function typewrite(el,html,done){
  if(typing)typing.finish();
  const tmp=document.createElement('div');tmp.innerHTML=html;
  const full=html;
  if(still){el.innerHTML=full;done&&done();return}
  // build list of text nodes to reveal progressively
  el.innerHTML=html;
  const nodes=[];const walk=n=>{n.childNodes.forEach(c=>{if(c.nodeType===3){nodes.push([c,c.textContent]);c.textContent=''}else walk(c)})};walk(el);
  const caret=document.createElement('span');caret.className='caret';
  let i=0,j=0,timer;
  const finish=()=>{clearTimeout(timer);nodes.forEach(([n,t])=>n.textContent=t);caret.remove();typing=null;done&&done()};
  const step=()=>{
    if(i>=nodes.length){finish();return}
    const [n,t]=nodes[i];
    n.textContent=t.slice(0,++j);n.parentNode.insertBefore(caret,n.nextSibling);
    if(j%3===0)SFX.type();
    if(j>=t.length){i++;j=0}
    timer=setTimeout(step,/[.!؟،]/.test(t[j-1]||'')?180:22);
  };
  typing={finish};step();
  var bb=el.closest('.bubble');if(bb)bb.addEventListener('click',function(){if(typing)typing.finish()},{once:true});
}
function addPts(n,el){S.pts+=n;save();const c=$('#pts');c.querySelector('b').textContent=S.pts;c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump');
  if(el){const r=el.getBoundingClientRect();const f=document.createElement('span');f.className='plus';f.textContent='+'+n+' ★';f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1300)}}
function react(mood){const m=document.querySelector('#view .muzn');if(!m)return;if(mood==='cheer')m.src=IMG.happy;m.classList.remove('cheer','oops');void m.offsetWidth;m.classList.add(mood);
  if(mood==='cheer')setTimeout(()=>{if(m.isConnected&&!m.dataset.keep)m.src=IMG.muzn},2400)}
function confetti(){if(still)return;const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#A6A9F0','#FFFFFF','#F5B942','#7376E4','#C9CBF2','#22A06B'];
  const P=Array.from({length:150},()=>({x:innerWidth*(.2+Math.random()*.6),y:innerHeight*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*14-5,s:5+Math.random()*7,c:cols[Math.random()*cols.length|0],r:Math.random()*6}));
  let f=0;(function step(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.36;p.x+=p.vx;p.y+=p.vy;p.r+=.18;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<130)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height)})()}
function modal(html,cls=''){const m=$('#modal');m.className='modal '+cls;$('#modalBox').innerHTML=html;m.hidden=false;const b=$('#modalBox button');b&&b.focus();}
function closeModal(){$('#modal').hidden=true}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]'))closeModal()});

}

const ATOM='<svg viewBox="0 0 90 90" aria-hidden="true"><g fill="none" stroke="#7FA8E8" stroke-width="3"><ellipse cx="45" cy="45" rx="40" ry="15"/><ellipse cx="45" cy="45" rx="40" ry="15" transform="rotate(60 45 45)"/><ellipse cx="45" cy="45" rx="40" ry="15" transform="rotate(-60 45 45)"/></g><circle cx="45" cy="45" r="8" fill="#E2474B"/><g fill="#F5B942"><circle cx="85" cy="45" r="4"/><circle cx="25" cy="10" r="4"/><circle cx="25" cy="80" r="4"/></g></svg>';
const BULB='<svg viewBox="0 0 40 40" aria-hidden="true" style="width:clamp(26px,2.6vw,36px);height:auto;order:2"><path d="M20 5a11 11 0 0 0-6 20c1.5 1 2 2.4 2 4h8c0-1.6.5-3 2-4A11 11 0 0 0 20 5z" fill="none" stroke="#4A4DC4" stroke-width="2.6"/><path d="M16 33h8M17 37h6" stroke="#4A4DC4" stroke-width="2.6" stroke-linecap="round"/></svg>';
function result(){
  hud('result');
  if(!S.done.includes('nwp')){S.done.push('nwp');save()}
  const RA='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>';
  view.innerHTML=`<section class="screen">
    <div class="res-top">${muzn('',true)}<div class="bubble tail-right">${nameTag}<div class="txt" id="t"></div></div></div>
    <div class="flow">
      <div class="stage"><div class="hd"><img src="${IMG.school}" alt="">المرحلة الثانوية</div>
        <div class="bd">${PATH.school.map(x=>`<button class="item">${x.atom?ATOM:`<img src="${IMG[x.img]}" alt="">`}${x.t}</button>`).join('')}</div></div>
      <span class="arr" aria-hidden="true">${RA}</span>
      <div class="stage"><div class="hd"><img src="${IMG.cap}" alt="">التخصص الجامعي</div>
        <div class="bd">${PATH.uni.map(x=>`<button class="item en"><img src="${IMG[x.img]}" alt="">${x.t}<small>${x.ar}</small></button>`).join('')}</div></div>
      <span class="arr mid" aria-hidden="true">${RA}</span>
      <div class="stage"><div class="hd"><img src="${IMG.gear}" alt="">المهارات المطلوبة</div>
        <div class="bd"><div class="skills">${PATH.skills.map(x=>`<span class="skill">${x.bulb?BULB:`<img src="${IMG[x.img]}" alt="">`}${x.t}</span>`).join('')}</div></div></div>
      <span class="arr" aria-hidden="true">${RA}</span>
      <div class="stage"><div class="hd"><img src="${IMG.brief}" alt=""><span>الوجهة<small>أحد مسارات عائلة الارصاد</small></span></div>
        <div class="bd"><p class="dest">${PATH.dest}</p></div></div>
    </div>
    <div class="award">
      <div class="medal"><span class="m"><img src="${IMG.bars}" alt=""></span><span>شارة أخصائي النمذجة العددية<small>مجموع نقاطك: ${S.pts} ★</small></span></div>
    </div>
    <div class="center-actions">
      ${nextBtn('اكتشف وظيفة أخرى','more')}
      <button class="ghostbtn" id="again">العب من جديد</button>
    </div></section>`;
  const m=view.querySelector('.muzn');m.dataset.keep=1;
  typewrite($('#t'),TEXT.done);
  const parts=[...view.querySelectorAll('.flow > *')];
  parts.forEach((p,i)=>setTimeout(()=>{p.classList.add('in');if(p.classList.contains('stage'))SFX.tap();if(i===parts.length-1){SFX.win();confetti();react('cheer')}},still?0:400+i*380));
  view.querySelectorAll('.item').forEach(b=>b.onclick=()=>{SFX.tap();b.animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:400})});
  $('#more').onclick=()=>{SFX.tap();go(jobs)};
  $('#again').onclick=()=>{SFX.tap();S.pts=0;save();go(cover)};
}

/* ================= boot ================= */
$('#homeBtn').onclick=()=>{SFX.tap();go(cover)};
drawSnd();
cover();
</script>
